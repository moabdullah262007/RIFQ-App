name: Build RIFQ Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract RIFQ project
        run: |
          mkdir -p project
          unzip -q RIFQ_RELEASE_READY.zip -d project

      - name: Find project directory
        run: |
          echo "Searching for package.json..."
          find project -name package.json -not -path '*/node_modules/*'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and build
        run: |
          PROJECT_DIR=$(dirname "$(find project -name package.json -not -path '*/node_modules/*' | head -1)")
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          npm install
          npm run build

      - name: Sync Capacitor Android
        run: |
          PROJECT_DIR=$(dirname "$(find project -name package.json -not -path '*/node_modules/*' | head -1)")
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make Gradle executable
        run: |
          PROJECT_DIR=$(dirname "$(find project -name package.json -not -path '*/node_modules/*' | head -1)")
          chmod +x "$PROJECT_DIR/android/gradlew"

      - name: Build Release APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name package.json -not -path '*/node_modules/*' | head -1)")
          cd "$PROJECT_DIR/android"
          ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RIFQ-Release-APK
          path: project/**/android/app/build/outputs/apk/release/*.apk
