name: Build RIFQ Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract RIFQ project
        run: |
          mkdir -p project
          unzip -q RIFQ_RELEASE_READY.zip -d project

      - name: Find project directory
        run: |
          PROJECT_DIR=$(dirname "$(find project -name package.json -not -path '*/node_modules/*' | head -1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Build web app
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Upgrade Android build configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("android")

          # Update Android Gradle Plugin
          for p in [
              root / "build.gradle",
              root / "build.gradle.kts",
              root / "settings.gradle",
              root / "settings.gradle.kts",
          ]:
              if p.exists():
                  s = p.read_text()
                  s = s.replace(
                      "com.android.tools.build:gradle:8.2.2",
                      "com.android.tools.build:gradle:8.9.2"
                  )
                  s = s.replace(
                      "com.android.application version '8.2.2'",
                      "com.android.application version '8.9.2'"
                  )
                  s = s.replace(
                      'com.android.application version "8.2.2"',
                      'com.android.application version "8.9.2"'
                  )
                  p.write_text(s)

          # Update compileSdk
          for p in root.rglob("*.gradle"):
              s = p.read_text()
              s = s.replace("compileSdk = 35", "compileSdk = 36")
              s = s.replace("compileSdk 35", "compileSdk 36")
              p.write_text(s)

          for p in root.rglob("*.gradle.kts"):
              s = p.read_text()
              s = s.replace("compileSdk = 35", "compileSdk = 36")
              p.write_text(s)

          # Suppress obsolete warning if applicable
          gradle_properties = root / "gradle.properties"
          with gradle_properties.open("a") as f:
              f.write("\nandroid.suppressUnsupportedCompileSdk=36\n")
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make Gradle executable
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RIFQ-Release-APK
          path: project/**/android/app/build/outputs/apk/release/*.apk
